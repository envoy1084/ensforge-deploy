name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm pack:check
      - name: Test published package tarballs
        run: pnpm test:packages

  integration:
    name: Contract integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENSFORGE_TEST_IMAGE: ghcr.io/thenamespace/ensforge-devnet@sha256:0a62a0ee9225c2ed457daca15a9f6fff4db7b8094ed19ca3ad611f35291d2015
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - name: Pull pinned ENS devnet image
        run: docker pull "${ENSFORGE_TEST_IMAGE}"
      - name: Build integration dependencies
        run: pnpm --filter @ensforge/test-env... build
      - name: Verify seeded ENS devnet
        run: pnpm test:integration
