name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm pack:check
      - name: Test published package tarballs
        run: pnpm test:packages

  integration:
    name: Contract integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - name: Build integration dependencies
        run: pnpm --filter @ensforge/test-env... build
      - name: Build pinned ENS devnet image
        run: pnpm build:devnet
      - name: Verify seeded ENS devnet
        run: pnpm test:integration
